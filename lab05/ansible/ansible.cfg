# Настройки Ansible для плейбуков тестового сервера.
# Закрытый ключ здесь намеренно не указан: Jenkins передаёт его параметром --private-key.

[defaults]
inventory = hosts.ini
# Ключ хоста test-server проверяется по ~/.ssh/known_hosts агента.
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# Предупреждения об устаревших возможностях оставлены включёнными.
deprecation_warnings = True

[privilege_escalation]
become_method = sudo
become_user = root
